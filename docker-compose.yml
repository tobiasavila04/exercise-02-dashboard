services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=noderegistry
      - POSTGRES_PASSWORD=noderegistry
      - POSTGRES_DB=noderegistry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noderegistry -d noderegistry"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://noderegistry:noderegistry@db:5432/noderegistry
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8080
    restart: on-failure

volumes:
  postgres_data:
